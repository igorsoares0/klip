services:
  postgres:
    image: postgres:17-alpine
    container_name: klip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: klip
      POSTGRES_PASSWORD: klip
      POSTGRES_DB: klip
    ports:
      - "5432:5432"
    volumes:
      - klip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klip -d klip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  klip-pgdata:
